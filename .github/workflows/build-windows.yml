name: Budowa Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, claude/wztek-app-requirements-an0qwl]

permissions:
  contents: write

defaults:
  run:
    working-directory: frontend

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      AKV_URL: ${{ secrets.AZURE_KEY_VAULT_URL }}
    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalacja zależności
        run: yarn install

      - name: Testy
        run: yarn test --watchAll=false
        env:
          CI: "true"

      - name: Budowa przenośnego .exe
        run: yarn dist

      # Podpis cyfrowy — uruchamia się tylko, gdy certyfikat jest skonfigurowany
      # w sekretach repozytorium (Settings -> Secrets and variables -> Actions).
      # Wymagane sekrety: AZURE_KEY_VAULT_URL, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET,
      # AZURE_TENANT_ID, AZURE_CERT_NAME. Bez nich budowa przebiega jak dotąd,
      # a plik pozostaje niepodpisany.
      - name: Podpis cyfrowy pliku .exe
        if: env.AKV_URL != ''
        shell: pwsh
        run: |
          dotnet tool install --global AzureSignTool
          $exe = Get-ChildItem dist/*.exe | Select-Object -First 1
          Write-Host "Podpisywanie: $($exe.FullName)"
          AzureSignTool sign `
            --azure-key-vault-url "${{ secrets.AZURE_KEY_VAULT_URL }}" `
            --azure-key-vault-client-id "${{ secrets.AZURE_CLIENT_ID }}" `
            --azure-key-vault-client-secret "${{ secrets.AZURE_CLIENT_SECRET }}" `
            --azure-key-vault-tenant-id "${{ secrets.AZURE_TENANT_ID }}" `
            --azure-key-vault-certificate "${{ secrets.AZURE_CERT_NAME }}" `
            --timestamp-rfc3161 "http://timestamp.digicert.com" `
            --timestamp-digest sha256 `
            --file-digest sha256 `
            "$($exe.FullName)"
          # potwierdzenie, że podpis jest osadzony
          $sig = Get-AuthenticodeSignature $exe.FullName
          Write-Host "Status podpisu: $($sig.Status) — $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "Podpis nieprawidłowy: $($sig.Status)" }

      - name: Publikacja artefaktu
        uses: actions/upload-artifact@v4
        with:
          name: Lechrol-WZ-windows
          path: frontend/dist/*.exe
          if-no-files-found: error
          retention-days: 90

      - name: Publikacja w Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p "require('./package.json').version")-build${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/*.exe \
            --title "Lechrol WZ ${TAG}" \
            --notes "Przenośny program dla Windows — pobierz plik .exe poniżej, skopiuj na komputer i uruchom (bez instalacji)." \
            --latest

      - name: Gałąź windows-exe (pobieranie przez git)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir exe-branch
          cp dist/*.exe exe-branch/
          cd exe-branch
          git init -b windows-exe
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add .
          git commit -m "Lechrol WZ - przenośny exe (automatyczna budowa ${GITHUB_RUN_NUMBER})"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" windows-exe
